name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (Vite/React)
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor
        working-directory: frontend
        run: npx cap sync android

      - name: Write google-services.json
        run: |
          if [ -z '${{ secrets.GOOGLE_SERVICES_JSON }}' ]; then
            echo "ERROR: GOOGLE_SERVICES_JSON secret is not set or is empty!"
            exit 1
          fi
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > frontend/android/app/google-services.json
          echo "google-services.json written successfully."

      - name: Generate debug keystore
        run: |
          if [ ! -f frontend/android/app/debug.keystore ]; then
            keytool -genkey -v \
              -keystore frontend/android/app/debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Make gradlew executable
        run: chmod +x frontend/android/gradlew

      - name: Build release APK
        working-directory: frontend/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace --info 2>&1 | grep -E '(FAILED|error:|> Task|What went wrong|Caused by|Execution failed)' || ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: silenx-release-apk
          path: frontend/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
